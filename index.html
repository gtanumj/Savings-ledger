<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Savings Ledger</title>
<meta name="theme-color" content="#14161C">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Savings Ledger">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#EFECE2;--paper-line:#C7C0AC;--ink:#1B2A4A;--ink-soft:#4A5266;
  --green:#1F5C3F;--red:#8C3325;--gold:#8A6A1E;--card:#FFF;
}
@media(prefers-color-scheme:dark){
  :root{
    --paper:#14161C;--paper-line:#454B58;--ink:#F5F3EC;--ink-soft:#C3C8D4;
    --green:#5FD79A;--red:#FF8B78;--gold:#F0C05C;--card:#1D2028;
  }
  html,body,.ledger-root{background:#14161C!important}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);min-height:100%}
body{min-height:100vh}
.ledger-root{
  font-family:'IBM Plex Sans',-apple-system,sans-serif;color:var(--ink);max-width:480px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 12px) env(safe-area-inset-right)
          calc(env(safe-area-inset-bottom) + 32px) env(safe-area-inset-left);
  background:var(--paper);
}
.ledger-num{font-family:'IBM Plex Mono','Courier New',monospace;font-variant-numeric:tabular-nums}
.nav-row{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
.nav-btn{background:none;border:1.5px solid var(--paper-line);border-radius:6px;width:34px;height:34px;font-size:16px;color:var(--ink)}
.month-title{font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:600}
.month-sub{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:1px}
.hero,.section,.chart-wrap{background:var(--card);border:1.5px solid var(--paper-line);border-radius:10px}
.hero{padding:20px 18px;margin-bottom:14px}
.hero-label{font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.hero-figure{font-size:34px;font-weight:700;line-height:1.1}
.hero-figure.pos{color:var(--green)} .hero-figure.neg{color:var(--red)}
.hero-rate{font-size:12px;color:var(--ink-soft);margin-top:6px}
.savings-split{margin-top:14px;padding-top:10px;border-top:1px dashed var(--paper-line)}
.savings-split-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0;font-size:12px;color:var(--ink-soft)}
.savings-split-row strong{color:var(--ink);font-family:'IBM Plex Mono','Courier New',monospace;font-weight:600}
.section{padding:14px 16px 16px;margin-bottom:12px}
.section.muted{background:var(--paper)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;padding-bottom:8px;border-bottom:1.5px solid var(--paper-line)}
.section-title{font-family:'Source Serif 4',Georgia,serif;font-size:15.5px;font-weight:600}
.section-total{font-size:14px;font-weight:700}
.green{color:var(--green)} .red{color:var(--red)} .gold{color:var(--gold)}
.row-line{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--paper-line)}
.row-line:last-child{border-bottom:none}
.row-label{flex:1;font-size:13.5px}
.row-input{width:108px;text-align:right;border:none;border-bottom:1.5px solid var(--paper-line);background:transparent;font-size:14px;padding:4px 2px;color:var(--ink)}
.row-input:focus{outline:none;border-bottom-color:var(--ink)}
.exp-row{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--paper-line)}
.exp-row:last-child{border-bottom:none}
.exp-cat{flex:1.3;font-size:12.5px;padding:6px 4px;border:1.5px solid var(--paper-line);border-radius:5px;background:var(--card);color:var(--ink)}
.exp-note{flex:1;min-width:0;font-size:12.5px;padding:6px;border:1.5px solid var(--paper-line);border-radius:5px;background:var(--card);color:var(--ink)}
.exp-amt{width:76px;text-align:right;font-size:13px;padding:6px 4px;border:1.5px solid var(--paper-line);border-radius:5px;background:var(--card);color:var(--ink)}
.exp-del{background:none;border:none;color:var(--red);font-size:18px;padding:2px 4px}
.add-btn{width:100%;margin-top:10px;padding:9px;border-radius:6px;border:1.5px dashed var(--paper-line);background:transparent;color:var(--ink-soft);font-size:13px}
.save-bar{display:flex;justify-content:center;margin:6px 0 18px}
.save-btn{background:var(--ink);color:var(--paper);border:none;border-radius:7px;padding:11px 26px;font-size:14px;font-weight:700}
.save-status{font-size:12px;min-height:14px;text-align:center}
.divider{text-align:center;margin:22px 0 14px}
.divider:before{content:"";display:block;border-top:1.5px solid var(--paper-line);position:relative;top:11px}
.divider span{position:relative;background:var(--paper);padding:0 10px;font-family:'Source Serif 4',Georgia,serif;font-size:17px}
.year-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.kpi{background:var(--card);border:1.5px solid var(--paper-line);border-radius:8px;padding:10px 12px}
.kpi-label{font-size:11px;color:var(--ink-soft)}
.kpi-value{font-size:17px;font-weight:700;margin-top:2px}
.chart-wrap{padding:14px 12px 8px;margin-bottom:12px}
table.year-table{width:100%;border-collapse:collapse;font-size:12px}
table.year-table th,table.year-table td{padding:5px 4px;text-align:right;border-bottom:1px dashed var(--paper-line)}
table.year-table th:first-child,table.year-table td:first-child{text-align:left}
.empty-note{font-size:12px;color:var(--ink-soft);text-align:center;padding:8px 0 2px}
.data-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 12px}
.data-btn{font-size:11px;padding:7px 10px;border:1px solid var(--paper-line);border-radius:5px;background:var(--card);color:var(--ink)}
</style>
</head>

<body>
<div class="ledger-root" id="root"></div>

<script>
(function(){

const CATS=[
  "Rent/Housing","Groceries","Utilities","Transportation","Dining Out & Takeout",
  "Shopping","Credit Card Bills","Entertainment","Health & Fitness","Travel","Miscellaneous","Investment/Saving"
];

const MONTHS=[
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const TEMPLATE_START={year:2026,month:8};

const TEMPLATE={
  salary:180000,
  otherIncome:4500,
  miscIncome:0,
  incomeAdjustments:[],
  salaryExpenses:[
    {category:"Rent/Housing",note:"Rent",amount:37000},
    {category:"Miscellaneous",note:"House help wages",amount:3000},
    {category:"Rent/Housing",note:"IMI",amount:20000}
  ],
  cardExpenses:[
    {category:"Utilities",note:"Electricity",amount:2000}
  ],
  liquidSavings:[],
  bankInterest:6300,
  investments:[
    {note:"Monthly SIP",amount:22000},
    {note:"ULIP",amount:12500}
  ],
  cardBillInitialized:false
};

const KEY="anushka-savings-ledger-v1";
const MIGRATION_V7="anushka-ledger-migration-v7";

let db=loadDB();
runMigrationV7();

let now=new Date();
let viewMonth=now.getMonth();
let viewYear=now.getFullYear();
let currentEntry=loadEntry(viewYear,viewMonth);

function empty(){
  return{
    salary:0,
    otherIncome:0,
    miscIncome:0,
    incomeAdjustments:[],
    salaryExpenses:[],
    cardExpenses:[],
    liquidSavings:[],
    bankInterest:0,
    investments:[],
    cardBillInitialized:false
  };
}

function clone(obj){return JSON.parse(JSON.stringify(obj))}
function uid(){return "e"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function key(y,m){return y+"-"+String(m+1).padStart(2,"0")}
function normalise(v){return String(v||"").trim().toLowerCase()}

function loadDB(){
  try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){return false}
}
function withIds(e){
  ["incomeAdjustments","salaryExpenses","cardExpenses","liquidSavings","investments"].forEach(g=>{
    e[g]=(e[g]||[]).map(x=>({id:x.id||uid(),...x}));
  });
  return e;
}
function previousMonth(y,m){return m===0?{year:y-1,month:11}:{year:y,month:m-1}}
function cardTotal(e){return (e.cardExpenses||[]).reduce((s,x)=>s+(Number(x.amount)||0),0)}
function previousCardSpend(y,m){
  const p=previousMonth(y,m),prev=db[key(p.year,p.month)];
  return prev?cardTotal(prev):0;
}
function previousCardNote(y,m){
  const p=previousMonth(y,m);
  return MONTHS[p.month]+" card bill";
}
function addInitialCardBill(e,y,m){
  if(e.cardBillInitialized)return e;
  const has=(e.salaryExpenses||[]).some(x=>normalise(x.category)==="credit card bills");
  if(!has){
    const amount=previousCardSpend(y,m);
    if(amount>0){
      e.salaryExpenses.unshift({id:uid(),category:"Credit Card Bills",note:previousCardNote(y,m),amount,autoCardBill:true});
    }
  }
  e.cardBillInitialized=true;
  return e;
}

function runMigrationV7(){
  if(localStorage.getItem(MIGRATION_V7)==="done")return;

  let changed=false;

  Object.keys(db).forEach(k=>{
    const e=db[k];
    if(!e||typeof e!=="object")return;

    e.miscIncome=Number(e.miscIncome)||0;
    e.incomeAdjustments=e.incomeAdjustments||[];
    e.salaryExpenses=e.salaryExpenses||[];
    e.cardExpenses=e.cardExpenses||[];
    e.liquidSavings=e.liquidSavings||[];
    e.investments=e.investments||[];

    // Preserve all existing salary-account expense rows exactly as entered.
    // Investments and liquid savings are tracked separately and are NOT
    // auto-added into Salary Account Expenses.

    if(Number(e.dividends||0)!==0 && !e.miscIncome){
      e.miscIncome=Number(e.dividends)||0;
      changed=true;
    }
    delete e.dividends;

    // Separate bank interest from Liquid Savings.
    let bankInterestFromLiquid=0;
    const cleanedLiquid=[];

    e.liquidSavings.forEach(x=>{
      const label=normalise(x.bucket||x.note);
      if(label==="bank interest" || label==="bank savings interest" || label==="interest"){
        bankInterestFromLiquid += Number(x.amount)||0;
        changed=true;
      }else{
        cleanedLiquid.push(x);
      }
    });

    e.liquidSavings=cleanedLiquid;

    if(typeof e.bankInterest==="undefined"){
      e.bankInterest=Number(e.savingsInterest)||0;
      changed=true;
    }

    if(bankInterestFromLiquid>0){
      // If the dedicated field is empty, migrate the old liquid-savings interest there.
      // If it already has a value, keep that value to avoid accidental duplication.
      if(!(Number(e.bankInterest)||0)){
        e.bankInterest=bankInterestFromLiquid;
      }
    }

    delete e.savingsInterest;
    db[k]=e;
  });

  if(changed)persist();
  localStorage.setItem(MIGRATION_V7,"done");
}

function eligible(y,m){return y>TEMPLATE_START.year || (y===TEMPLATE_START.year && m>=TEMPLATE_START.month)}

function loadEntry(y,m){
  const k=key(y,m);
  if(db[k])return addInitialCardBill(withIds(clone(db[k])),y,m);
  if(eligible(y,m))return addInitialCardBill(withIds(clone(TEMPLATE)),y,m);
  return addInitialCardBill(empty(),y,m);
}

function saveEntry(y,m,e){db[key(y,m)]=clone(e);return persist()}

function fmt(n){
  n=Math.round(Number(n)||0);
  const neg=n<0;
  n=Math.abs(n);
  return (neg?"-":"")+"₹"+n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");
}

function adjustmentTotal(e){
  return (e.incomeAdjustments||[]).reduce((s,x)=>{
    const a=Number(x.amount)||0;
    return s+((x.sign||"add")==="subtract"?-a:a);
  },0);
}

function totals(e){
  const income=
    (Number(e.salary)||0)+
    (Number(e.otherIncome)||0)+
    (Number(e.miscIncome)||0)+
    adjustmentTotal(e);

  const salaryExpenses=(e.salaryExpenses||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const cardSpending=cardTotal(e);
  const liquidSavings=(e.liquidSavings||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const bankInterest=Number(e.bankInterest)||0;
  const investments=(e.investments||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);

  const balanceAfterExpenses=income-salaryExpenses;
  const leftoverSalary=balanceAfterExpenses-investments-liquidSavings;
  const savingsThisMonth=liquidSavings+bankInterest;
  const totalSavings=leftoverSalary+savingsThisMonth;

  return{
    income,
    salaryExpenses,
    cardSpending,
    liquidSavings,
    bankInterest,
    investments,
    balanceAfterExpenses,
    leftoverSalary,
    savingsThisMonth,
    totalSavings,
    rate:income?totalSavings/income:0
  };
}

function sync(){
  [
    ["salaryInput","salary"],
    ["otherIncomeInput","otherIncome"],
    ["miscIncomeInput","miscIncome"],
    ["bankInterestInput","bankInterest"]
  ].forEach(([id,f])=>{
    const el=document.getElementById(id);
    if(el)currentEntry[f]=Number(el.value)||0;
  });

  document.querySelectorAll("[data-field]").forEach(el=>{
    const item=(currentEntry[el.dataset.group]||[]).find(x=>x.id===el.dataset.id);
    if(item)item[el.dataset.field]=el.dataset.field==="amount"?Number(el.value)||0:el.value;
  });
}

function expenseRows(list,group){
  if(!list.length)return`<div class="empty-note">—</div>`;
  return list.map(x=>`
    <div class="exp-row">
      <select class="exp-cat" data-group="${group}" data-field="category" data-id="${x.id}">
        ${CATS.map(c=>`<option ${c===x.category?"selected":""}>${c}</option>`).join("")}
      </select>
      <input class="exp-note" data-group="${group}" data-field="note" data-id="${x.id}" placeholder="Note" value="${String(x.note||"").replace(/"/g,"&quot;")}">
      <input class="exp-amt ledger-num" data-group="${group}" data-field="amount" data-id="${x.id}" type="number" inputmode="decimal" placeholder="0" value="${x.amount||""}">
      <button class="exp-del" data-group="${group}" data-id="${x.id}">×</button>
    </div>
  `).join("");
}

function simpleRows(list,group,label){
  if(!list.length)return`<div class="empty-note">—</div>`;
  return list.map(x=>`
    <div class="exp-row">
      <input class="exp-note" style="flex:2" data-group="${group}" data-field="${group==="liquidSavings"?"bucket":"note"}" data-id="${x.id}" placeholder="${label}" value="${String((group==="liquidSavings"?x.bucket:x.note)||"").replace(/"/g,"&quot;")}">
      <input class="exp-amt ledger-num" data-group="${group}" data-field="amount" data-id="${x.id}" type="number" inputmode="decimal" placeholder="0" value="${x.amount||""}">
      <button class="exp-del" data-group="${group}" data-id="${x.id}">×</button>
    </div>
  `).join("");
}

function incomeAdjustmentRows(list){
  if(!list.length)return"";
  return list.map(x=>`
    <div class="exp-row">
      <select class="exp-cat" style="flex:0 0 92px" data-group="incomeAdjustments" data-field="sign" data-id="${x.id}">
        <option value="add" ${(x.sign||"add")==="add"?"selected":""}>+ Add</option>
        <option value="subtract" ${x.sign==="subtract"?"selected":""}>− Subtract</option>
      </select>
      <input class="exp-note" data-group="incomeAdjustments" data-field="note" data-id="${x.id}" placeholder="Note" value="${String(x.note||"").replace(/"/g,"&quot;")}">
      <input class="exp-amt ledger-num" data-group="incomeAdjustments" data-field="amount" data-id="${x.id}" type="number" inputmode="decimal" min="0" placeholder="0" value="${x.amount||""}">
      <button class="exp-del" data-group="incomeAdjustments" data-id="${x.id}">×</button>
    </div>
  `).join("");
}

function render(){
  const root=document.getElementById("root");
  const t=totals(currentEntry);

  root.innerHTML=`
    <div class="nav-row">
      <button class="nav-btn" id="prev">‹</button>
      <div style="text-align:center">
        <div class="month-title">${MONTHS[viewMonth]} ${viewYear}</div>
        <div class="month-sub">Savings Ledger</div>
      </div>
      <button class="nav-btn" id="next">›</button>
    </div>

    <div class="hero">
      <div class="hero-label">Total savings</div>
      <div class="hero-figure ${t.totalSavings>=0?"pos":"neg"}">${fmt(t.totalSavings)}</div>
      <div class="hero-rate">${t.income?(t.rate*100).toFixed(1)+"% savings rate":"—"}</div>
      <div class="savings-split">
        <div class="savings-split-row"><span>Leftover salary</span><strong>${fmt(t.leftoverSalary)}</strong></div>
        <div class="savings-split-row"><span>Savings this month</span><strong>${fmt(t.savingsThisMonth)}</strong></div>
        <div class="savings-split-row"><span>Investments this month</span><strong>${fmt(t.investments)}</strong></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Income</div><div class="section-total green">${fmt(t.income)}</div></div>
      ${[
        ["Salary","salaryInput",currentEntry.salary],
        ["Rental / other income","otherIncomeInput",currentEntry.otherIncome],
        ["Miscellaneous","miscIncomeInput",currentEntry.miscIncome]
      ].map(([label,id,val])=>`
        <div class="row-line">
          <div class="row-label">${label}</div>
          <input class="row-input ledger-num" id="${id}" type="number" inputmode="decimal" placeholder="0" value="${val||""}">
        </div>
      `).join("")}
      ${incomeAdjustmentRows(currentEntry.incomeAdjustments||[])}
      <button class="add-btn" id="addIncome">+ Add / subtract income</button>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Salary account expenses</div><div class="section-total red">${fmt(t.salaryExpenses)}</div></div>
      ${expenseRows(currentEntry.salaryExpenses||[],"salaryExpenses")}
      <button class="add-btn" id="addSal">+ Add expense</button>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Credit card spending</div><div class="section-total gold">${fmt(t.cardSpending)}</div></div>
      ${expenseRows(currentEntry.cardExpenses||[],"cardExpenses")}
      <button class="add-btn" id="addCard">+ Add card expense</button>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Liquid savings</div><div class="section-total green">${fmt(t.liquidSavings)}</div></div>
      ${simpleRows(currentEntry.liquidSavings||[],"liquidSavings","Bucket")}
      <button class="add-btn" id="addLiquid">+ Add liquid saving</button>
    </div>

    <div class="section muted">
      <div class="section-head"><div class="section-title">Bank interest</div><div class="section-total gold">${fmt(t.bankInterest)}</div></div>
      <div class="row-line">
        <div class="row-label">Interest</div>
        <input class="row-input ledger-num" id="bankInterestInput" type="number" inputmode="decimal" placeholder="0" value="${currentEntry.bankInterest||""}">
      </div>
    </div>

    <div class="section muted">
      <div class="section-head"><div class="section-title">Investments</div><div class="section-total gold">${fmt(t.investments)}</div></div>
      ${simpleRows(currentEntry.investments||[],"investments","Investment")}
      <button class="add-btn" id="addInv">+ Add investment</button>
    </div>

    <div class="save-bar"><button class="save-btn" id="save">Save month</button></div>
    <div class="save-status" id="status"></div>

    <div class="data-bar">
      <button class="data-btn" id="excel">Export Excel</button>
      <button class="data-btn" id="export">Export backup</button>
      <button class="data-btn" id="importBtn">Import backup</button>
      <input id="file" type="file" accept=".json" hidden>
    </div>

    <div class="divider"><span>Year in review</span></div>
    <div id="year"></div>
  `;

  bind();
  renderYear();
}

function bind(){
  document.getElementById("prev").onclick=()=>change(-1);
  document.getElementById("next").onclick=()=>change(1);

  ["salaryInput","otherIncomeInput","miscIncomeInput","bankInterestInput"].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener("input",e=>{
      currentEntry[
        id==="salaryInput"?"salary":
        id==="otherIncomeInput"?"otherIncome":
        id==="miscIncomeInput"?"miscIncome":"bankInterest"
      ]=Number(e.target.value)||0;
      updateSummaryOnly();
    });
  });

  document.getElementById("addIncome").onclick=()=>{
    sync();currentEntry.incomeAdjustments.push({id:uid(),sign:"add",note:"",amount:""});render();
  };
  document.getElementById("addSal").onclick=()=>{
    sync();currentEntry.salaryExpenses.push({id:uid(),category:"Miscellaneous",note:"",amount:""});render();
  };
  document.getElementById("addCard").onclick=()=>{
    sync();currentEntry.cardExpenses.push({id:uid(),category:"Miscellaneous",note:"",amount:""});render();
  };
  document.getElementById("addLiquid").onclick=()=>{
    sync();currentEntry.liquidSavings.push({id:uid(),bucket:"",amount:""});render();
  };
  document.getElementById("addInv").onclick=()=>{
    sync();currentEntry.investments.push({id:uid(),note:"",amount:""});render();
  };

  document.querySelectorAll(".exp-del").forEach(btn=>{
    btn.onclick=()=>{
      sync();
      currentEntry[btn.dataset.group]=currentEntry[btn.dataset.group].filter(x=>x.id!==btn.dataset.id);
      render();
    };
  });

  document.querySelectorAll("[data-field]").forEach(el=>{
    const update=()=>{
      const item=(currentEntry[el.dataset.group]||[]).find(x=>x.id===el.dataset.id);
      if(item)item[el.dataset.field]=el.dataset.field==="amount"?Number(el.value)||0:el.value;
      updateSummaryOnly();
    };
    el.addEventListener("input",update);
    el.addEventListener("change",update);
  });

  document.getElementById("save").onclick=save;
  document.getElementById("excel").onclick=exportExcel;
  document.getElementById("export").onclick=exportBackup;
  document.getElementById("importBtn").onclick=()=>document.getElementById("file").click();
  document.getElementById("file").onchange=importBackup;
}

function updateSummaryOnly(){
  const t=totals(currentEntry);

  const hero=document.querySelector(".hero-figure");
  hero.textContent=fmt(t.totalSavings);
  hero.className="hero-figure "+(t.totalSavings>=0?"pos":"neg");

  const rate=document.querySelector(".hero-rate");
  rate.textContent=t.income?(t.rate*100).toFixed(1)+"% savings rate":"—";

  const split=document.querySelectorAll(".savings-split-row strong");
  const splitVals=[t.leftoverSalary,t.savingsThisMonth,t.investments];
  split.forEach((el,i)=>el.textContent=fmt(splitVals[i]));

  const sectionTotals=document.querySelectorAll(".section-total");
  const vals=[t.income,t.salaryExpenses,t.cardSpending,t.liquidSavings,t.bankInterest,t.investments];
  sectionTotals.forEach((el,i)=>el.textContent=fmt(vals[i]));

  renderYear();
}

function save(){
  sync();
  const ok=saveEntry(viewYear,viewMonth,currentEntry);
  const s=document.getElementById("status");
  s.textContent=ok?"Saved ✓":"Could not save";
  s.style.color=ok?"var(--green)":"var(--red)";
  setTimeout(()=>{if(s)s.textContent=""},2500);
}

function change(direction){
  sync();
  saveEntry(viewYear,viewMonth,currentEntry);
  viewMonth+=direction;
  if(viewMonth<0){viewMonth=11;viewYear--}
  if(viewMonth>11){viewMonth=0;viewYear++}
  currentEntry=loadEntry(viewYear,viewMonth);
  render();
}

function renderYear(){
  const wrap=document.getElementById("year");
  if(!wrap)return;

  const rows=[];
  for(let m=0;m<12;m++){
    const e=m===viewMonth?currentEntry:(db[key(viewYear,m)]?withIds(clone(db[key(viewYear,m)])):empty());
    const t=totals(e);
    rows.push({
      month:MONTHS[m].slice(0,3),
      leftover:t.leftoverSalary,
      liquid:t.liquidSavings,
      interest:t.bankInterest,
      investments:t.investments,
      total:t.totalSavings
    });
  }

  const sum=f=>rows.reduce((s,r)=>s+r[f],0);
  const yl=sum("leftover"),yliq=sum("liquid"),yint=sum("interest"),yinv=sum("investments"),ys=sum("total");

  wrap.innerHTML=`
    <div class="year-kpis">
      <div class="kpi"><div class="kpi-label">Leftover salary</div><div class="kpi-value">${fmt(yl)}</div></div>
      <div class="kpi"><div class="kpi-label">Liquid savings</div><div class="kpi-value green">${fmt(yliq)}</div></div>
      <div class="kpi"><div class="kpi-label">Bank interest</div><div class="kpi-value gold">${fmt(yint)}</div></div>
      <div class="kpi"><div class="kpi-label">Investments</div><div class="kpi-value gold">${fmt(yinv)}</div></div>
    </div>
    <div class="year-kpis">
      <div class="kpi"><div class="kpi-label">Total savings</div><div class="kpi-value green">${fmt(ys)}</div></div>
    </div>
    <table class="year-table">
      <thead><tr><th>Month</th><th>Leftover</th><th>Liquid</th><th>Interest</th><th>Total</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr><td>${r.month}</td><td class="ledger-num">${fmt(r.leftover)}</td><td class="ledger-num">${fmt(r.liquid)}</td><td class="ledger-num">${fmt(r.interest)}</td><td class="ledger-num">${fmt(r.total)}</td></tr>`).join("")}
        <tr><td><strong>Total</strong></td><td class="ledger-num"><strong>${fmt(yl)}</strong></td><td class="ledger-num"><strong>${fmt(yliq)}</strong></td><td class="ledger-num"><strong>${fmt(yint)}</strong></td><td class="ledger-num"><strong>${fmt(ys)}</strong></td></tr>
      </tbody>
    </table>
  `;
}

function exportExcel(){
  sync();saveEntry(viewYear,viewMonth,currentEntry);
  if(typeof XLSX==="undefined"){alert("Excel export could not load. Please connect to the internet and try again.");return}

  const monthly=[],salaryRows=[],cardRows=[],liquidRows=[],investmentRows=[],adjustmentRows=[];

  Object.keys(db).sort().forEach(k=>{
    const [year,mm]=k.split("-").map(Number),month=MONTHS[mm-1],e=db[k]||empty(),t=totals(e);

    monthly.push({
      Year:year,Month:month,Salary:Number(e.salary)||0,"Rental / Other Income":Number(e.otherIncome)||0,
      Miscellaneous:Number(e.miscIncome)||0,"Income Adjustments":adjustmentTotal(e),"Total Income":t.income,
      "Salary Account Expenses":t.salaryExpenses,"Credit Card Spending":t.cardSpending,
      "Liquid Savings":t.liquidSavings,"Bank Interest":t.bankInterest,Investments:t.investments,
      "Leftover Salary":t.leftoverSalary,"Savings This Month":t.savingsThisMonth,"Total Savings":t.totalSavings,
      "Savings Rate %":Number((t.rate*100).toFixed(2))
    });

    (e.salaryExpenses||[]).forEach(x=>salaryRows.push({Year:year,Month:month,Category:x.category||"",Note:x.note||"",Amount:Number(x.amount)||0}));
    (e.cardExpenses||[]).forEach(x=>cardRows.push({Year:year,Month:month,Category:x.category||"",Note:x.note||"",Amount:Number(x.amount)||0}));
    (e.liquidSavings||[]).forEach(x=>liquidRows.push({Year:year,Month:month,Bucket:x.bucket||"",Amount:Number(x.amount)||0}));
    (e.investments||[]).forEach(x=>investmentRows.push({Year:year,Month:month,Investment:x.note||"",Amount:Number(x.amount)||0}));
    (e.incomeAdjustments||[]).forEach(x=>{
      const a=Number(x.amount)||0;
      adjustmentRows.push({Year:year,Month:month,Type:(x.sign||"add")==="subtract"?"Subtract":"Add",Note:x.note||"",Amount:(x.sign||"add")==="subtract"?-a:a});
    });
  });

  const wb=XLSX.utils.book_new();
  [["Monthly Summary",monthly],["Salary Expenses",salaryRows],["Credit Card",cardRows],["Liquid Savings",liquidRows],["Investments",investmentRows],["Income Adjustments",adjustmentRows]].forEach(([name,data])=>{
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),name);
  });

  const d=new Date(),stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const output=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  downloadBlob(new Blob([output],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"Savings_Ledger_All_Years_"+stamp+".xlsx");
}

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportBackup(){
  sync();saveEntry(viewYear,viewMonth,currentEntry);
  downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),"savings-ledger-backup.json");
}

async function importBackup(e){
  const f=e.target.files[0];
  if(!f)return;
  try{
    const obj=JSON.parse(await f.text());
    if(!obj||typeof obj!=="object"||Array.isArray(obj))throw new Error();
    db=obj;persist();runMigrationV7();currentEntry=loadEntry(viewYear,viewMonth);render();
  }catch(err){alert("Invalid backup file.")}
  e.target.value="";
}

render();

})();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(r=>r.update()).catch(console.error);
  });
}
</script>
