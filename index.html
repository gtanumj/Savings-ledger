<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Savings Ledger</title>

<meta name="theme-color" content="#14161C">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Savings Ledger">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#EFECE2;
  --paper-line:#C7C0AC;
  --ink:#1B2A4A;
  --ink-soft:#4A5266;
  --green:#1F5C3F;
  --red:#8C3325;
  --gold:#8A6A1E;
  --card:#FFF;
}

@media(prefers-color-scheme:dark){
  :root{
    --paper:#14161C;
    --paper-line:#454B58;
    --ink:#F5F3EC;
    --ink-soft:#C3C8D4;
    --green:#5FD79A;
    --red:#FF8B78;
    --gold:#F0C05C;
    --card:#1D2028;
  }

  html,body,.ledger-root{
    background:#14161C!important;
  }
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--paper);
  min-height:100%;
}

body{min-height:100vh}

.ledger-root{
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  color:var(--ink);
  max-width:480px;
  margin:0 auto;
  padding:4px 0 32px;
  background:var(--paper);
}

.ledger-num{
  font-family:'IBM Plex Mono','Courier New',monospace;
  font-variant-numeric:tabular-nums;
}

.nav-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 4px 14px;
}

.nav-btn{
  background:none;
  border:1.5px solid var(--paper-line);
  border-radius:6px;
  width:34px;
  height:34px;
  font-size:16px;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
}

.month-title{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:19px;
  font-weight:600;
}

.month-sub{
  font-size:11px;
  color:var(--ink-soft);
  text-align:center;
  margin-top:1px;
}

.hero,.section,.chart-wrap{
  background:var(--card);
  border:1.5px solid var(--paper-line);
  border-radius:10px;
}

.hero{
  padding:20px 18px;
  margin-bottom:14px;
}

.hero-label{
  font-size:12px;
  color:var(--ink-soft);
  margin-bottom:4px;
}

.hero-figure{
  font-size:34px;
  font-weight:700;
  line-height:1.1;
}

.hero-figure.pos{color:var(--green)}
.hero-figure.neg{color:var(--red)}

.hero-rate{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:6px;
}

.section{
  padding:14px 16px 16px;
  margin-bottom:12px;
}

.section.muted{
  background:var(--paper);
}

.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:8px;
  padding-bottom:8px;
  border-bottom:1.5px solid var(--paper-line);
}

.section-title{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:15.5px;
  font-weight:600;
}

.section-total{
  font-size:14px;
  font-weight:700;
}

.green{color:var(--green)}
.red{color:var(--red)}
.gold{color:var(--gold)}

.row-line{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 0;
  border-bottom:1px dashed var(--paper-line);
}

.row-line:last-child{border-bottom:none}

.row-label{
  flex:1;
  font-size:13.5px;
}

.row-input{
  width:108px;
  text-align:right;
  border:none;
  border-bottom:1.5px solid var(--paper-line);
  background:transparent;
  font-size:14px;
  padding:4px 2px;
  color:var(--ink);
}

.row-input:focus{
  outline:none;
  border-bottom-color:var(--ink);
}

.exp-row{
  display:flex;
  gap:6px;
  align-items:center;
  padding:6px 0;
  border-bottom:1px dashed var(--paper-line);
}

.exp-row:last-child{border-bottom:none}

.exp-cat{
  flex:1.3;
  font-size:12.5px;
  padding:6px 4px;
  border:1.5px solid var(--paper-line);
  border-radius:5px;
  background:var(--card);
  color:var(--ink);
}

.exp-note{
  flex:1;
  min-width:0;
  font-size:12.5px;
  padding:6px;
  border:1.5px solid var(--paper-line);
  border-radius:5px;
  background:var(--card);
  color:var(--ink);
}

.exp-amt{
  width:76px;
  text-align:right;
  font-size:13px;
  padding:6px 4px;
  border:1.5px solid var(--paper-line);
  border-radius:5px;
  background:var(--card);
  color:var(--ink);
}

.exp-del{
  background:none;
  border:none;
  color:var(--red);
  font-size:18px;
  padding:2px 4px;
}

.add-btn{
  width:100%;
  margin-top:10px;
  padding:9px;
  border-radius:6px;
  border:1.5px dashed var(--paper-line);
  background:transparent;
  color:var(--ink-soft);
  font-size:13px;
}

.save-bar{
  display:flex;
  justify-content:center;
  margin:6px 0 18px;
}

.save-btn{
  background:var(--ink);
  color:var(--paper);
  border:none;
  border-radius:7px;
  padding:11px 26px;
  font-size:14px;
  font-weight:700;
}

.save-status{
  font-size:12px;
  min-height:14px;
  text-align:center;
}

.divider{
  text-align:center;
  margin:22px 0 14px;
}

.divider:before{
  content:"";
  display:block;
  border-top:1.5px solid var(--paper-line);
  position:relative;
  top:11px;
}

.divider span{
  position:relative;
  background:var(--paper);
  padding:0 10px;
  font-family:'Source Serif 4',Georgia,serif;
  font-size:17px;
}

.year-kpis{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}

.kpi{
  background:var(--card);
  border:1.5px solid var(--paper-line);
  border-radius:8px;
  padding:10px 12px;
}

.kpi-label{
  font-size:11px;
  color:var(--ink-soft);
}

.kpi-value{
  font-size:17px;
  font-weight:700;
  margin-top:2px;
}

.chart-wrap{
  padding:14px 12px 8px;
  margin-bottom:12px;
}

table.year-table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

table.year-table th,
table.year-table td{
  padding:5px 4px;
  text-align:right;
  border-bottom:1px dashed var(--paper-line);
}

table.year-table th:first-child,
table.year-table td:first-child{
  text-align:left;
}

.empty-note{
  font-size:12px;
  color:var(--ink-soft);
  text-align:center;
  padding:8px 0 2px;
}

.data-bar{
  display:flex;
  gap:6px;
  justify-content:center;
  margin:0 0 12px;
}

.data-btn{
  font-size:11px;
  padding:6px 9px;
  border:1px solid var(--paper-line);
  border-radius:5px;
  background:var(--card);
  color:var(--ink);
}
</style>
</head>

<body>

<div class="ledger-root" id="root"></div>

<script>
(function(){

const CATS=[
  "Rent/Housing",
  "Groceries",
  "Utilities",
  "Transportation",
  "Dining Out & Takeout",
  "Shopping",
  "Credit Card Bills",
  "SIP/Investments",
  "Entertainment",
  "Health & Fitness",
  "Travel",
  "Miscellaneous"
];

const MONTHS=[
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const TEMPLATE_START={year:2026,month:8};

const TEMPLATE={
  salary:180000,
  otherIncome:4500,
  dividends:0,
  savingsInterest:6300,
  incomeAdjustments:[],
  salaryExpenses:[
    {category:"Rent/Housing",note:"Rent",amount:37000},
    {category:"Miscellaneous",note:"House help wages",amount:3000},
    {category:"Miscellaneous",note:"Support to sister",amount:20000},
    {category:"Utilities",note:"Electricity",amount:2000},
    {category:"SIP/Investments",note:"ULIP",amount:12500}
  ],
  cardExpenses:[],
  investments:[
    {note:"Monthly SIP (auto-debit from savings account)",amount:22000}
  ]
};

const KEY="anushka-savings-ledger-v1";

let db=loadDB();
let now=new Date();
let viewMonth=now.getMonth();
let viewYear=now.getFullYear();
let currentEntry=empty();
let usedTemplate=false;

function empty(){
  return{
    salary:0,
    otherIncome:0,
    dividends:0,
    savingsInterest:0,
    incomeAdjustments:[],
    salaryExpenses:[],
    cardExpenses:[],
    investments:[]
  };
}

function uid(){
  return "e"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
}

function withIds(e){
  ["incomeAdjustments","salaryExpenses","cardExpenses","investments"].forEach(g=>{
    e[g]=(e[g]||[]).map(x=>({id:x.id||uid(),...x}));
  });
  return e;
}

function key(y,m){
  return y+"-"+String(m+1).padStart(2,"0");
}

function loadDB(){
  try{
    return JSON.parse(localStorage.getItem(KEY)||"{}");
  }catch(e){
    return{};
  }
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(db));
    return true;
  }catch(e){
    return false;
  }
}

function eligible(y,m){
  return y>TEMPLATE_START.year ||
    (y===TEMPLATE_START.year && m>=TEMPLATE_START.month);
}

function loadEntry(y,m){
  const k=key(y,m);

  if(db[k]){
    usedTemplate=false;
    return withIds(JSON.parse(JSON.stringify(db[k])));
  }

  if(eligible(y,m)){
    usedTemplate=true;
    return withIds(JSON.parse(JSON.stringify(TEMPLATE)));
  }

  usedTemplate=false;
  return empty();
}

function saveEntry(y,m,e){
  db[key(y,m)]=JSON.parse(JSON.stringify(e));
  return persist();
}

function fmt(n){
  n=Math.round(Number(n)||0);
  let neg=n<0;
  n=Math.abs(n);
  let s=n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return(neg?"-":"")+"₹"+s;
}

function cardTotal(e){
  return (e.cardExpenses||[]).reduce(
    (s,x)=>s+(Number(x.amount)||0),0
  );
}

function previousMonth(y,m){
  return m===0
    ? {year:y-1,month:11}
    : {year:y,month:m-1};
}

function previousCardBill(y,m){
  const p=previousMonth(y,m);
  const saved=db[key(p.year,p.month)];
  return saved ? cardTotal(saved) : 0;
}

function adjustmentTotal(e){
  return (e.incomeAdjustments||[]).reduce((sum,x)=>{
    const amount=Number(x.amount)||0;
    return sum+((x.sign||"add")==="subtract" ? -amount : amount);
  },0);
}

function totals(e,y=viewYear,m=viewMonth){

  let adjustment=adjustmentTotal(e);

  let income=
    (e.salary||0)+
    (e.otherIncome||0)+
    (e.dividends||0)+
    adjustment;

  let salaryExp=
    (e.salaryExpenses||[]).reduce(
      (s,x)=>s+(Number(x.amount)||0),0
    );

  let cardExp=cardTotal(e);
  let cardBill=previousCardBill(y,m);
  let expenses=salaryExp+cardBill;

  let investments=
    (e.investments||[]).reduce(
      (s,x)=>s+(Number(x.amount)||0),0
    );

  let si=e.savingsInterest||0;

  return{
    income,
    adjustment,
    salaryExp,
    cardExp,
    cardBill,
    expenses,
    investments,
    savingsInterest:si,
    savings:income-expenses,
    rate:income?(income-expenses)/income:0
  };
}

function sync(){

  const r=document.getElementById("root");
  if(!r)return;

  [
    ["salaryInput","salary"],
    ["otherIncomeInput","otherIncome"],
    ["dividendsInput","dividends"],
    ["savingsInterestInput","savingsInterest"]
  ].forEach(([id,f])=>{
    let x=document.getElementById(id);
    if(x)currentEntry[f]=Number(x.value)||0;
  });

  r.querySelectorAll("[data-field]").forEach(el=>{

    let item=(currentEntry[el.dataset.group]||[])
      .find(x=>x.id===el.dataset.id);

    if(item){
      item[el.dataset.field]=
        el.dataset.field==="amount"
          ? Number(el.value)||0
          : el.value;
    }
  });
}

function rows(list,g){

  if(!list.length){
    return '<div class="empty-note">—</div>';
  }

  return list.map(x=>`
    <div class="exp-row">

      <select
        class="exp-cat"
        data-group="${g}"
        data-field="category"
        data-id="${x.id}"
      >
        ${CATS.map(c=>`
          <option ${c===x.category?"selected":""}>${c}</option>
        `).join("")}
      </select>

      <input
        class="exp-note"
        data-group="${g}"
        data-field="note"
        data-id="${x.id}"
        placeholder="Note"
        value="${String(x.note||"").replace(/"/g,"&quot;")}"
      >

      <input
        class="exp-amt ledger-num"
        data-group="${g}"
        data-field="amount"
        data-id="${x.id}"
        type="number"
        inputmode="decimal"
        placeholder="0"
        value="${x.amount||""}"
      >

      <button
        class="exp-del"
        data-group="${g}"
        data-id="${x.id}"
      >×</button>

    </div>
  `).join("");
}

function incomeAdjustmentRows(list){

  if(!list.length){
    return "";
  }

  return list.map(x=>`
    <div class="exp-row">

      <select
        class="exp-cat"
        style="flex:0 0 92px"
        data-group="incomeAdjustments"
        data-field="sign"
        data-id="${x.id}"
      >
        <option value="add" ${(x.sign||"add")==="add"?"selected":""}>
          + Add
        </option>

        <option value="subtract" ${x.sign==="subtract"?"selected":""}>
          − Subtract
        </option>
      </select>

      <input
        class="exp-note"
        data-group="incomeAdjustments"
        data-field="note"
        data-id="${x.id}"
        placeholder="Note"
        value="${String(x.note||"").replace(/"/g,"&quot;")}"
      >

      <input
        class="exp-amt ledger-num"
        data-group="incomeAdjustments"
        data-field="amount"
        data-id="${x.id}"
        type="number"
        inputmode="decimal"
        min="0"
        placeholder="0"
        value="${x.amount||""}"
      >

      <button
        class="exp-del"
        data-group="incomeAdjustments"
        data-id="${x.id}"
      >×</button>

    </div>
  `).join("");
}

function render(){

  const r=document.getElementById("root");
  const t=totals(currentEntry);

  let inv=(currentEntry.investments||[]).map(x=>`
    <div class="exp-row">

      <input
        class="exp-note"
        style="flex:2"
        data-group="investments"
        data-field="note"
        data-id="${x.id}"
        placeholder="Investment"
        value="${String(x.note||"").replace(/"/g,"&quot;")}"
      >

      <input
        class="exp-amt ledger-num"
        data-group="investments"
        data-field="amount"
        data-id="${x.id}"
        type="number"
        inputmode="decimal"
        placeholder="0"
        value="${x.amount||""}"
      >

      <button
        class="exp-del"
        data-group="investments"
        data-id="${x.id}"
      >×</button>

    </div>
  `).join("") || '<div class="empty-note">—</div>';

  r.innerHTML=`

    <div class="nav-row">

      <button class="nav-btn" id="prev">‹</button>

      <div style="text-align:center">
        <div class="month-title">${MONTHS[viewMonth]} ${viewYear}</div>
        <div class="month-sub">Savings Ledger</div>
      </div>

      <button class="nav-btn" id="next">›</button>

    </div>

    <div class="hero">

      <div class="hero-label">Net savings</div>

      <div class="hero-figure ${t.savings>=0?"pos":"neg"}">
        ${fmt(t.savings)}
      </div>

      <div class="hero-rate">
        ${t.income?(t.rate*100).toFixed(1)+"% savings rate":"—"}
      </div>

    </div>


    <div class="section">

      <div class="section-head">
        <div class="section-title">Income</div>
        <div class="section-total green">${fmt(t.income)}</div>
      </div>

      ${["Salary","Rental / other income","Dividends"]
        .map((lab,i)=>`
          <div class="row-line">

            <div class="row-label">${lab}</div>

            <input
              class="row-input ledger-num"
              id="${["salaryInput","otherIncomeInput","dividendsInput"][i]}"
              type="number"
              inputmode="decimal"
              placeholder="0"
              value="${
                [
                  currentEntry.salary,
                  currentEntry.otherIncome,
                  currentEntry.dividends
                ][i]||""
              }"
            >

          </div>
        `).join("")}

      <div>
        ${incomeAdjustmentRows(currentEntry.incomeAdjustments||[])}
      </div>

      <button class="add-btn" id="addIncome">
        + Add / subtract income
      </button>

    </div>


    <div class="section">

      <div class="section-head">
        <div class="section-title">Salary account expenses</div>
        <div class="section-total red">${fmt(t.salaryExp)}</div>
      </div>

      <div>
        ${rows(currentEntry.salaryExpenses,"salaryExpenses")}
      </div>

      <button class="add-btn" id="addSal">
        + Add expense
      </button>

    </div>


    <div class="section">

      <div class="section-head">
        <div class="section-title">Credit card spending</div>
        <div class="section-total gold">${fmt(t.cardExp)}</div>
      </div>

      <div>
        ${rows(currentEntry.cardExpenses,"cardExpenses")}
      </div>

      <button class="add-btn" id="addCard">
        + Add card expense
      </button>

    </div>


    <div class="section muted">

      <div class="section-head" style="margin-bottom:0;border-bottom:none;padding-bottom:0">
        <div class="section-title">Previous month's card bill</div>
        <div class="section-total red">${fmt(t.cardBill)}</div>
      </div>

    </div>


    <div class="section muted">

      <div class="section-head">
        <div class="section-title">Savings account interest</div>
        <div class="section-total gold">${fmt(t.savingsInterest)}</div>
      </div>

      <div class="row-line">

        <div class="row-label">Interest</div>

        <input
          class="row-input ledger-num"
          id="savingsInterestInput"
          type="number"
          inputmode="decimal"
          placeholder="0"
          value="${currentEntry.savingsInterest||""}"
        >

      </div>

    </div>


    <div class="section muted">

      <div class="section-head">
        <div class="section-title">Investments</div>
        <div class="section-total gold">${fmt(t.investments)}</div>
      </div>

      <div>${inv}</div>

      <button class="add-btn" id="addInv">
        + Add investment
      </button>

    </div>


    <div class="save-bar">
      <button class="save-btn" id="save">
        Save month
      </button>
    </div>

    <div class="save-status" id="status"></div>


    <div class="data-bar">

      <button class="data-btn" id="export">
        Export backup
      </button>

      <button class="data-btn" id="importBtn">
        Import backup
      </button>

      <input id="file" type="file" accept=".json" hidden>

    </div>


    <div class="divider">
      <span>Year in review</span>
    </div>

    <div id="year"></div>
  `;

  bind();
  renderYear();
}

function bind(){

  document.getElementById("prev").onclick=()=>change(-1);
  document.getElementById("next").onclick=()=>change(1);

  ["salaryInput","otherIncomeInput","dividendsInput","savingsInterestInput"]
    .forEach(id=>{

      document.getElementById(id).oninput=e=>{

        currentEntry[
          id==="salaryInput"?"salary":
          id==="otherIncomeInput"?"otherIncome":
          id==="dividendsInput"?"dividends":
          "savingsInterest"
        ]=Number(e.target.value)||0;

        usedTemplate=false;
        refresh();
      };
    });


  document.getElementById("addIncome").onclick=()=>{

    sync();

    currentEntry.incomeAdjustments=currentEntry.incomeAdjustments||[];

    currentEntry.incomeAdjustments.push({
      id:uid(),
      sign:"add",
      note:"",
      amount:""
    });

    usedTemplate=false;
    render();
  };


  document.getElementById("addSal").onclick=()=>{

    sync();

    currentEntry.salaryExpenses.push({
      id:uid(),
      category:CATS[0],
      note:"",
      amount:""
    });

    render();
  };


  document.getElementById("addCard").onclick=()=>{

    sync();

    currentEntry.cardExpenses.push({
      id:uid(),
      category:"Credit Card Bills",
      note:"",
      amount:""
    });

    render();
  };


  document.getElementById("addInv").onclick=()=>{

    sync();

    currentEntry.investments.push({
      id:uid(),
      note:"",
      amount:""
    });

    render();
  };


  document.querySelectorAll(".exp-del").forEach(btn=>{

    btn.onclick=()=>{

      sync();

      currentEntry[btn.dataset.group]=
        currentEntry[btn.dataset.group]
          .filter(x=>x.id!==btn.dataset.id);

      render();
    };
  });


  document.querySelectorAll("[data-field]").forEach(el=>{

    el.oninput=el.onchange=()=>{

      let item=(currentEntry[el.dataset.group]||[])
        .find(x=>x.id===el.dataset.id);

      if(item){
        item[el.dataset.field]=
          el.dataset.field==="amount"
            ? Number(el.value)||0
            : el.value;
      }

      usedTemplate=false;
      refresh();
    };
  });


  document.getElementById("save").onclick=save;


  document.getElementById("export").onclick=()=>{

    let blob=new Blob(
      [JSON.stringify(db,null,2)],
      {type:"application/json"}
    );

    let a=document.createElement("a");

    a.href=URL.createObjectURL(blob);
    a.download="savings-ledger-backup.json";
    a.click();

    URL.revokeObjectURL(a.href);
  };


  document.getElementById("importBtn").onclick=()=>{
    document.getElementById("file").click();
  };


  document.getElementById("file").onchange=async e=>{

    let f=e.target.files[0];

    if(!f)return;

    try{

      let obj=JSON.parse(await f.text());

      if(typeof obj!=="object")throw 0;

      db=obj;
      persist();

      currentEntry=loadEntry(viewYear,viewMonth);

      render();

    }catch(err){

      alert("Invalid backup file.");
    }
  };
}

function refresh(){

  let t=totals(currentEntry);

  let h=document.querySelector(".hero-figure");
  let rate=document.querySelector(".hero-rate");

  h.textContent=fmt(t.savings);

  h.className=
    "hero-figure "+(t.savings>=0?"pos":"neg");

  rate.textContent=
    t.income
      ?(t.rate*100).toFixed(1)+"% savings rate"
      :"—";

  let totalsEls=document.querySelectorAll(".section-total");

  let values=[
    t.income,
    t.salaryExp,
    t.cardExp,
    t.cardBill,
    t.savingsInterest,
    t.investments
  ];

  totalsEls.forEach((el,i)=>{
    if(values[i]!==undefined){
      el.textContent=fmt(values[i]);
    }
  });
}

function save(){

  sync();

  let ok=saveEntry(
    viewYear,
    viewMonth,
    currentEntry
  );

  let s=document.getElementById("status");

  usedTemplate=false;

  s.textContent=ok?"Saved ✓":"Could not save";
  s.style.color=ok?"var(--green)":"var(--red)";

  renderYear();

  setTimeout(()=>{
    if(s)s.textContent="";
  },2500);
}

function change(d){

  sync();

  saveEntry(
    viewYear,
    viewMonth,
    currentEntry
  );

  viewMonth+=d;

  if(viewMonth<0){
    viewMonth=11;
    viewYear--;
  }

  if(viewMonth>11){
    viewMonth=0;
    viewYear++;
  }

  currentEntry=loadEntry(
    viewYear,
    viewMonth
  );

  render();
}

function renderYear(){

  let wrap=document.getElementById("year");

  let rows=[];

  for(let m=0;m<12;m++){

    let e=
      m===viewMonth
        ?currentEntry
        :(db[key(viewYear,m)]
          ?withIds(JSON.parse(JSON.stringify(db[key(viewYear,m)])))
          :empty());

    let t=totals(e,viewYear,m);

    rows.push({
      month:MONTHS[m].slice(0,3),
      income:t.income,
      expenses:t.expenses,
      savings:t.savings,
      investments:t.investments,
      savingsInterest:t.savingsInterest
    });
  }

  let yi=rows.reduce((s,r)=>s+r.income,0);
  let ye=rows.reduce((s,r)=>s+r.expenses,0);
  let ys=yi-ye;
  let yinv=rows.reduce((s,r)=>s+r.investments,0);
  let yint=rows.reduce((s,r)=>s+r.savingsInterest,0);

  let yr=yi?ys/yi*100:0;

  let max=Math.max(
    1,
    ...rows.map(r=>Math.abs(r.savings))
  );

  let bw=26;
  let gap=10;
  let ch=90;
  let base=45;
  let w=rows.length*(bw+gap);

  let bars=rows.map((r,i)=>{

    let x=i*(bw+gap);
    let h=Math.abs(r.savings)/max*(ch/2-6);
    let y=r.savings>=0?base-h:base;
    let c=r.savings>=0?"var(--green)":"var(--red)";

    return`
      <rect
        x="${x}"
        y="${y}"
        width="${bw}"
        height="${Math.max(h,1)}"
        fill="${c}"
        rx="2"
      />

      <text
        x="${x+bw/2}"
        y="${ch+12}"
        font-size="9"
        fill="var(--ink-soft)"
        text-anchor="middle"
      >
        ${r.month}
      </text>
    `;
  }).join("");

  wrap.innerHTML=`

    <div class="year-kpis">

      <div class="kpi">
        <div class="kpi-label">Income</div>
        <div class="kpi-value">${fmt(yi)}</div>
      </div>

      <div class="kpi">
        <div class="kpi-label">Expenses</div>
        <div class="kpi-value">${fmt(ye)}</div>
      </div>

      <div class="kpi">
        <div class="kpi-label">Savings</div>
        <div
          class="kpi-value"
          style="color:${ys>=0?"var(--green)":"var(--red)"}"
        >
          ${fmt(ys)}
        </div>
      </div>

      <div class="kpi">
        <div class="kpi-label">Savings rate</div>
        <div class="kpi-value">${yr.toFixed(1)}%</div>
      </div>

    </div>


    <div class="year-kpis">

      <div class="kpi">
        <div class="kpi-label">Investments</div>
        <div class="kpi-value" style="color:var(--gold)">
          ${fmt(yinv)}
        </div>
      </div>

      <div class="kpi">
        <div class="kpi-label">Interest</div>
        <div class="kpi-value" style="color:var(--gold)">
          ${fmt(yint)}
        </div>
      </div>

    </div>


    <div class="chart-wrap">

      <svg
        viewBox="0 0 ${w} ${ch+20}"
        width="100%"
        height="140"
      >

        <line
          x1="0"
          y1="${base}"
          x2="${w}"
          y2="${base}"
          stroke="var(--paper-line)"
        />

        ${bars}

      </svg>

    </div>


    <table class="year-table">

      <thead>
        <tr>
          <th>Month</th>
          <th>Income</th>
          <th>Expenses</th>
          <th>Savings</th>
        </tr>
      </thead>

      <tbody>

        ${rows.map(r=>`
          <tr>
            <td>${r.month}</td>
            <td class="ledger-num">${fmt(r.income)}</td>
            <td class="ledger-num">${fmt(r.expenses)}</td>
            <td class="ledger-num">${fmt(r.savings)}</td>
          </tr>
        `).join("")}

        <tr>
          <td><strong>Total</strong></td>
          <td class="ledger-num"><strong>${fmt(yi)}</strong></td>
          <td class="ledger-num"><strong>${fmt(ye)}</strong></td>
          <td class="ledger-num"><strong>${fmt(ys)}</strong></td>
        </tr>

      </tbody>

    </table>
  `;
}

currentEntry=loadEntry(
  viewYear,
  viewMonth
);

render();

})();
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker
      .register("./sw.js")
      .catch(console.error);
  });
}
</script>

</body>
</html>
