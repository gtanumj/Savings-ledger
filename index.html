<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Savings Ledger</title>

<meta name="theme-color" content="#14161C">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Savings Ledger">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#EFECE2;
  --paper-line:#C7C0AC;
  --ink:#1B2A4A;
  --ink-soft:#4A5266;
  --green:#1F5C3F;
  --red:#8C3325;
  --gold:#8A6A1E;
  --card:#FFF;
}

@media(prefers-color-scheme:dark){
  :root{
    --paper:#14161C;
    --paper-line:#454B58;
    --ink:#F5F3EC;
    --ink-soft:#C3C8D4;
    --green:#5FD79A;
    --red:#FF8B78;
    --gold:#F0C05C;
    --card:#1D2028;
  }
  html,body,.ledger-root{background:#14161C!important}
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);min-height:100%}
body{min-height:100vh}

.ledger-root{
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  color:var(--ink);
  max-width:480px;
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    env(safe-area-inset-right)
    calc(env(safe-area-inset-bottom) + 32px)
    env(safe-area-inset-left);
  background:var(--paper);
}

.ledger-num{
  font-family:'IBM Plex Mono','Courier New',monospace;
  font-variant-numeric:tabular-nums;
}

.nav-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 4px 14px;
}

.nav-btn{
  background:none;
  border:1.5px solid var(--paper-line);
  border-radius:6px;
  width:34px;
  height:34px;
  font-size:16px;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
}

.month-title{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:19px;
  font-weight:600;
}

.month-sub{
  font-size:11px;
  color:var(--ink-soft);
  text-align:center;
  margin-top:1px;
}

.hero,.section,.chart-wrap{
  background:var(--card);
  border:1.5px solid var(--paper-line);
  border-radius:10px;
}

.hero{
  padding:20px 18px;
  margin-bottom:14px;
}

.hero-label{
  font-size:12px;
  color:var(--ink-soft);
  margin-bottom:4px;
}

.hero-figure{
  font-size:34px;
  font-weight:700;
  line-height:1.1;
}

.hero-figure.pos{color:var(--green)}
.hero-figure.neg{color:var(--red)}

.hero-rate{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:6px;
}

.savings-split{
  margin-top:14px;
  padding-top:10px;
  border-top:1px dashed var(--paper-line);
}

.savings-split-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:4px 0;
  font-size:12px;
  color:var(--ink-soft);
}

.savings-split-row strong{
  color:var(--ink);
  font-family:'IBM Plex Mono','Courier New',monospace;
  font-weight:600;
}

.section{
  padding:14px 16px 16px;
  margin-bottom:12px;
}

.section.muted{background:var(--paper)}

.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:8px;
  padding-bottom:8px;
  border-bottom:1.5px solid var(--paper-line);
}

.section-title{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:15.5px;
  font-weight:600;
}

.section-total{
  font-size:14px;
  font-weight:700;
}

.green{color:var(--green)}
.red{color:var(--red)}
.gold{color:var(--gold)}

.row-line{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 0;
  border-bottom:1px dashed var(--paper-line);
}

.row-line:last-child{border-bottom:none}

.row-label{
  flex:1;
  font-size:13.5px;
}

.row-input{
  width:108px;
  text-align:right;
  border:none;
  border-bottom:1.5px solid var(--paper-line);
  background:transparent;
  font-size:14px;
  padding:4px 2px;
  color:var(--ink);
}

.row-input:focus{
  outline:none;
  border-bottom-color:var(--ink);
}

.exp-row{
  display:flex;
  gap:6px;
  align-items:center;
  padding:6px 0;
  border-bottom:1px dashed var(--paper-line);
}

.exp-row:last-child{border-bottom:none}

.exp-cat{
  flex:1.3;
  font-size:12.5px;
  padding:6px 4px;
  border:1.5px solid var(--paper-line);
  border-radius:5px;
  background:var(--card);
  color:var(--ink);
}

.exp-note{
  flex:1;
  min-width:0;
  font-size:12.5px;
  padding:6px;
  border:1.5px solid var(--paper-line);
  border-radius:5px;
  background:var(--card);
  color:var(--ink);
}

.exp-amt{
  width:76px;
  text-align:right;
  font-size:13px;
  padding:6px 4px;
  border:1.5px solid var(--paper-line);
  border-radius:5px;
  background:var(--card);
  color:var(--ink);
}

.exp-del{
  background:none;
  border:none;
  color:var(--red);
  font-size:18px;
  padding:2px 4px;
}

.add-btn{
  width:100%;
  margin-top:10px;
  padding:9px;
  border-radius:6px;
  border:1.5px dashed var(--paper-line);
  background:transparent;
  color:var(--ink-soft);
  font-size:13px;
}

.save-bar{
  display:flex;
  justify-content:center;
  margin:6px 0 18px;
}

.save-btn{
  background:var(--ink);
  color:var(--paper);
  border:none;
  border-radius:7px;
  padding:11px 26px;
  font-size:14px;
  font-weight:700;
}

.save-status{
  font-size:12px;
  min-height:14px;
  text-align:center;
}

.divider{
  text-align:center;
  margin:22px 0 14px;
}

.divider:before{
  content:"";
  display:block;
  border-top:1.5px solid var(--paper-line);
  position:relative;
  top:11px;
}

.divider span{
  position:relative;
  background:var(--paper);
  padding:0 10px;
  font-family:'Source Serif 4',Georgia,serif;
  font-size:17px;
}

.year-kpis{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}

.kpi{
  background:var(--card);
  border:1.5px solid var(--paper-line);
  border-radius:8px;
  padding:10px 12px;
}

.kpi-label{
  font-size:11px;
  color:var(--ink-soft);
}

.kpi-value{
  font-size:17px;
  font-weight:700;
  margin-top:2px;
}

.chart-wrap{
  padding:14px 12px 8px;
  margin-bottom:12px;
}

table.year-table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

table.year-table th,
table.year-table td{
  padding:5px 4px;
  text-align:right;
  border-bottom:1px dashed var(--paper-line);
}

table.year-table th:first-child,
table.year-table td:first-child{text-align:left}

.empty-note{
  font-size:12px;
  color:var(--ink-soft);
  text-align:center;
  padding:8px 0 2px;
}

.data-bar{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
  margin:0 0 12px;
}

.data-btn{
  font-size:11px;
  padding:7px 10px;
  border:1px solid var(--paper-line);
  border-radius:5px;
  background:var(--card);
  color:var(--ink);
}
</style>
</head>

<body>

<div class="ledger-root" id="root"></div>

<script>
(function(){

const CATS=[
  "Rent/Housing",
  "Groceries",
  "Utilities",
  "Transportation",
  "Dining Out & Takeout",
  "Shopping",
  "Credit Card Bills",
  "SIP/Investments",
  "Entertainment",
  "Health & Fitness",
  "Travel",
  "Miscellaneous"
];

const MONTHS=[
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const TEMPLATE_START={year:2026,month:8};

const TEMPLATE={
  salary:180000,
  otherIncome:4500,
  dividends:0,
  savingsInterest:6300,
  incomeAdjustments:[],
  salaryExpenses:[
    {category:"Rent/Housing",note:"Rent",amount:37000},
    {category:"Miscellaneous",note:"House help wages",amount:3000},
    {category:"Rent/Housing",note:"IMI",amount:20000}
  ],
  liquidSavings:[],
  cardExpenses:[
    {category:"Utilities",note:"Electricity",amount:2000}
  ],
  investments:[
    {note:"Monthly SIP",amount:22000},
    {note:"ULIP",amount:12500}
  ],
  cardBillInitialized:false
};

/* DO NOT CHANGE: preserves your existing ledger data */
const KEY="anushka-savings-ledger-v1";
const MIGRATION_KEY="anushka-ledger-migration-v3";
const SAVINGS_MIGRATION_KEY="anushka-ledger-migration-v4";

let db=loadDB();
runMigration();
runSavingsMigration();

let now=new Date();
let viewMonth=now.getMonth();
let viewYear=now.getFullYear();
let currentEntry=empty();

function empty(){
  return{
    salary:0,
    otherIncome:0,
    dividends:0,
    savingsInterest:0,
    incomeAdjustments:[],
    salaryExpenses:[],
    liquidSavings:[],
    cardExpenses:[],
    investments:[],
    cardBillInitialized:false
  };
}

function clone(obj){return JSON.parse(JSON.stringify(obj))}

function uid(){
  return "e"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
}

function key(y,m){
  return y+"-"+String(m+1).padStart(2,"0");
}

function normalise(v){
  return String(v||"").trim().toLowerCase();
}

function loadDB(){
  try{
    return JSON.parse(localStorage.getItem(KEY)||"{}");
  }catch(e){
    return{};
  }
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(db));
    return true;
  }catch(e){
    return false;
  }
}

function withIds(e){
  ["incomeAdjustments","salaryExpenses","liquidSavings","cardExpenses","investments"].forEach(g=>{
    e[g]=(e[g]||[]).map(x=>({id:x.id||uid(),...x}));
  });
  return e;
}

function previousMonth(y,m){
  return m===0?{year:y-1,month:11}:{year:y,month:m-1};
}

function cardTotal(e){
  return (e.cardExpenses||[]).reduce((sum,x)=>sum+(Number(x.amount)||0),0);
}

function previousCardSpend(y,m){
  const p=previousMonth(y,m);
  const previousEntry=db[key(p.year,p.month)];
  return previousEntry?cardTotal(previousEntry):0;
}

function previousCardNote(y,m){
  const p=previousMonth(y,m);
  return MONTHS[p.month]+" card bill";
}

function addInitialCardBill(e,y,m){
  if(e.cardBillInitialized)return e;

  const alreadyHasBill=(e.salaryExpenses||[]).some(x=>
    normalise(x.category)==="credit card bills"
  );

  if(!alreadyHasBill){
    const amount=previousCardSpend(y,m);
    if(amount>0){
      e.salaryExpenses.unshift({
        id:uid(),
        category:"Credit Card Bills",
        note:previousCardNote(y,m),
        amount,
        autoCardBill:true
      });
    }
  }

  e.cardBillInitialized=true;
  return e;
}

function runMigration(){
  if(localStorage.getItem(MIGRATION_KEY)==="done")return;

  let changed=false;
  const savedKeys=Object.keys(db).sort();

  savedKeys.forEach(k=>{
    let e=db[k];
    if(!e||typeof e!=="object")return;

    e.incomeAdjustments=e.incomeAdjustments||[];
    e.salaryExpenses=e.salaryExpenses||[];
    e.cardExpenses=e.cardExpenses||[];
    e.investments=e.investments||[];

    /* Support to sister -> Rent/Housing / IMI */
    e.salaryExpenses.forEach(x=>{
      if(normalise(x.note)==="support to sister"){
        x.category="Rent/Housing";
        x.note="IMI";
        changed=true;
      }
    });

    /* Electricity -> credit card */
    const electricityRows=e.salaryExpenses.filter(x=>normalise(x.note)==="electricity");

    electricityRows.forEach(x=>{
      const exists=e.cardExpenses.some(c=>
        normalise(c.note)==="electricity" &&
        Number(c.amount||0)===Number(x.amount||0)
      );

      if(!exists){
        e.cardExpenses.push({
          id:uid(),
          category:"Utilities",
          note:"Electricity",
          amount:Number(x.amount)||0
        });
      }
      changed=true;
    });

    if(electricityRows.length){
      e.salaryExpenses=e.salaryExpenses.filter(x=>normalise(x.note)!=="electricity");
    }

    /* Monthly SIP in expense + investment tracking */
    const monthlyInvestment=e.investments.find(x=>
      normalise(x.note).includes("monthly sip") &&
      Number(x.amount||0)===22000
    );

    const monthlySalaryExpense=e.salaryExpenses.find(x=>
      normalise(x.note).includes("monthly sip") &&
      Number(x.amount||0)===22000
    );

    if(monthlyInvestment&&!monthlySalaryExpense){
      e.salaryExpenses.push({
        id:uid(),
        category:"SIP/Investments",
        note:"Monthly SIP",
        amount:22000
      });
      changed=true;
    }

    if(monthlySalaryExpense&&!monthlyInvestment){
      e.investments.push({
        id:uid(),
        note:"Monthly SIP",
        amount:22000
      });
      changed=true;
    }

    /* ULIP stays expense + tracked as investment */
    const ulipExpense=e.salaryExpenses.find(x=>normalise(x.note)==="ulip");
    const ulipInvestment=e.investments.find(x=>normalise(x.note)==="ulip");

    if(ulipExpense&&!ulipInvestment){
      e.investments.push({
        id:uid(),
        note:"ULIP",
        amount:Number(ulipExpense.amount)||0
      });
      changed=true;
    }

    db[k]=e;
  });

  /* Add editable previous-month credit card bill to saved months */
  savedKeys.forEach(k=>{
    const parts=k.split("-");
    const y=Number(parts[0]);
    const m=Number(parts[1])-1;
    let e=db[k];
    if(!e)return;

    if(e.cardBillInitialized!==true){
      const alreadyHasBill=(e.salaryExpenses||[]).some(x=>
        normalise(x.category)==="credit card bills"
      );

      if(!alreadyHasBill){
        const amount=previousCardSpend(y,m);
        if(amount>0){
          e.salaryExpenses.unshift({
            id:uid(),
            category:"Credit Card Bills",
            note:previousCardNote(y,m),
            amount,
            autoCardBill:true
          });
          changed=true;
        }
      }

      e.cardBillInitialized=true;
      changed=true;
    }

    db[k]=e;
  });

  if(changed)persist();
  localStorage.setItem(MIGRATION_KEY,"done");
}

function runSavingsMigration(){
  if(localStorage.getItem(SAVINGS_MIGRATION_KEY)==="done")return;

  let changed=false;

  Object.keys(db).forEach(k=>{
    const e=db[k];
    if(!e||typeof e!=="object")return;

    e.liquidSavings=e.liquidSavings||[];
    e.salaryExpenses=e.salaryExpenses||[];
    e.investments=e.investments||[];

    ["monthly sip","ulip"].forEach(target=>{
      const expenseRows=e.salaryExpenses.filter(x=>normalise(x.note)===target);

      expenseRows.forEach(x=>{
        const exists=e.investments.some(inv=>normalise(inv.note)===target);
        if(!exists){
          e.investments.push({
            id:uid(),
            note:target==="monthly sip"?"Monthly SIP":"ULIP",
            amount:Number(x.amount)||0
          });
        }
      });

      const before=e.salaryExpenses.length;
      e.salaryExpenses=e.salaryExpenses.filter(x=>normalise(x.note)!==target);
      if(e.salaryExpenses.length!==before)changed=true;
    });

    db[k]=e;
  });

  if(changed)persist();
  localStorage.setItem(SAVINGS_MIGRATION_KEY,"done");
}

function eligible(y,m){
  return y>TEMPLATE_START.year || (y===TEMPLATE_START.year && m>=TEMPLATE_START.month);
}

function loadEntry(y,m){
  const k=key(y,m);

  if(db[k]){
    return addInitialCardBill(withIds(clone(db[k])),y,m);
  }

  if(eligible(y,m)){
    return addInitialCardBill(withIds(clone(TEMPLATE)),y,m);
  }

  return addInitialCardBill(empty(),y,m);
}

function saveEntry(y,m,e){
  db[key(y,m)]=clone(e);
  return persist();
}

function fmt(n){
  n=Math.round(Number(n)||0);
  const negative=n<0;
  n=Math.abs(n);
  const formatted=n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (negative?"-":"")+"₹"+formatted;
}

function adjustmentTotal(e){
  return (e.incomeAdjustments||[]).reduce((sum,x)=>{
    const amount=Number(x.amount)||0;
    return sum+((x.sign||"add")==="subtract"?-amount:amount);
  },0);
}

function totals(e){
  const adjustment=adjustmentTotal(e);

  const income=
    (Number(e.salary)||0)+
    (Number(e.otherIncome)||0)+
    (Number(e.dividends)||0)+
    adjustment;

  const salaryExp=(e.salaryExpenses||[]).reduce(
    (sum,x)=>sum+(Number(x.amount)||0),0
  );

  const liquidSavings=(e.liquidSavings||[]).reduce(
    (sum,x)=>sum+(Number(x.amount)||0),0
  );

  const cardExp=cardTotal(e);

  const investments=(e.investments||[]).reduce(
    (sum,x)=>sum+(Number(x.amount)||0),0
  );

  const savingsInterest=Number(e.savingsInterest)||0;
  const salaryLeftover=income-salaryExp-liquidSavings-investments;
  const totalSavings=salaryLeftover+liquidSavings+investments;

  return{
    income,adjustment,salaryExp,liquidSavings,cardExp,investments,
    savingsInterest,salaryLeftover,savings:totalSavings,
    rate:income?totalSavings/income:0
  };
}

function sync(){
  const root=document.getElementById("root");
  if(!root)return;

  [
    ["salaryInput","salary"],
    ["otherIncomeInput","otherIncome"],
    ["dividendsInput","dividends"],
    ["savingsInterestInput","savingsInterest"]
  ].forEach(([id,field])=>{
    const element=document.getElementById(id);
    if(element)currentEntry[field]=Number(element.value)||0;
  });

  root.querySelectorAll("[data-field]").forEach(el=>{
    const item=(currentEntry[el.dataset.group]||[]).find(x=>x.id===el.dataset.id);
    if(item){
      item[el.dataset.field]=el.dataset.field==="amount"
        ?Number(el.value)||0
        :el.value;
    }
  });
}

function rows(list,group){
  if(!list.length)return`<div class="empty-note">—</div>`;

  return list.map(x=>`
    <div class="exp-row">
      <select
        class="exp-cat"
        data-group="${group}"
        data-field="category"
        data-id="${x.id}"
      >
        ${CATS.map(c=>`
          <option ${c===x.category?"selected":""}>${c}</option>
        `).join("")}
      </select>

      <input
        class="exp-note"
        data-group="${group}"
        data-field="note"
        data-id="${x.id}"
        placeholder="Note"
        value="${String(x.note||"").replace(/"/g,"&quot;")}"
      >

      <input
        class="exp-amt ledger-num"
        data-group="${group}"
        data-field="amount"
        data-id="${x.id}"
        type="number"
        inputmode="decimal"
        placeholder="0"
        value="${x.amount||""}"
      >

      <button
        class="exp-del"
        data-group="${group}"
        data-id="${x.id}"
      >×</button>
    </div>
  `).join("");
}

function incomeAdjustmentRows(list){
  if(!list.length)return"";

  return list.map(x=>`
    <div class="exp-row">
      <select
        class="exp-cat"
        style="flex:0 0 92px"
        data-group="incomeAdjustments"
        data-field="sign"
        data-id="${x.id}"
      >
        <option value="add" ${(x.sign||"add")==="add"?"selected":""}>+ Add</option>
        <option value="subtract" ${x.sign==="subtract"?"selected":""}>− Subtract</option>
      </select>

      <input
        class="exp-note"
        data-group="incomeAdjustments"
        data-field="note"
        data-id="${x.id}"
        placeholder="Note"
        value="${String(x.note||"").replace(/"/g,"&quot;")}"
      >

      <input
        class="exp-amt ledger-num"
        data-group="incomeAdjustments"
        data-field="amount"
        data-id="${x.id}"
        type="number"
        inputmode="decimal"
        min="0"
        placeholder="0"
        value="${x.amount||""}"
      >

      <button
        class="exp-del"
        data-group="incomeAdjustments"
        data-id="${x.id}"
      >×</button>
    </div>
  `).join("");
}

function liquidSavingRows(list){
  if(!list.length)return`<div class="empty-note">—</div>`;

  return list.map(x=>`
    <div class="exp-row">
      <input class="exp-note" style="flex:1.25" data-group="liquidSavings" data-field="bucket" data-id="${x.id}" placeholder="Bucket" value="${String(x.bucket||"").replace(/"/g,"&quot;")}">
      <input class="exp-note" data-group="liquidSavings" data-field="note" data-id="${x.id}" placeholder="Note" value="${String(x.note||"").replace(/"/g,"&quot;")}">
      <input class="exp-amt ledger-num" data-group="liquidSavings" data-field="amount" data-id="${x.id}" type="number" inputmode="decimal" placeholder="0" value="${x.amount||""}">
      <button class="exp-del" data-group="liquidSavings" data-id="${x.id}">×</button>
    </div>
  `).join("");
}

function investmentRows(list){
  if(!list.length)return`<div class="empty-note">—</div>`;

  return list.map(x=>`
    <div class="exp-row">
      <input
        class="exp-note"
        style="flex:2"
        data-group="investments"
        data-field="note"
        data-id="${x.id}"
        placeholder="Investment"
        value="${String(x.note||"").replace(/"/g,"&quot;")}"
      >

      <input
        class="exp-amt ledger-num"
        data-group="investments"
        data-field="amount"
        data-id="${x.id}"
        type="number"
        inputmode="decimal"
        placeholder="0"
        value="${x.amount||""}"
      >

      <button
        class="exp-del"
        data-group="investments"
        data-id="${x.id}"
      >×</button>
    </div>
  `).join("");
}

function render(){
  const root=document.getElementById("root");
  const t=totals(currentEntry);

  root.innerHTML=`
    <div class="nav-row">
      <button class="nav-btn" id="prev" aria-label="Previous month">‹</button>

      <div style="text-align:center">
        <div class="month-title">${MONTHS[viewMonth]} ${viewYear}</div>
        <div class="month-sub">Savings Ledger</div>
      </div>

      <button class="nav-btn" id="next" aria-label="Next month">›</button>
    </div>

    <div class="hero">
      <div class="hero-label">Total savings</div>
      <div class="hero-figure ${t.savings>=0?"pos":"neg"}">${fmt(t.savings)}</div>
      <div class="hero-rate">
        ${t.income?(t.rate*100).toFixed(1)+"% savings rate":"—"}
      </div>
      <div class="savings-split">
        <div class="savings-split-row"><span>Salary account leftover</span><strong>${fmt(t.salaryLeftover)}</strong></div>
        <div class="savings-split-row"><span>Liquid savings</span><strong>${fmt(t.liquidSavings)}</strong></div>
        <div class="savings-split-row"><span>Investments</span><strong>${fmt(t.investments)}</strong></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Income</div>
        <div class="section-total green">${fmt(t.income)}</div>
      </div>

      ${[
        ["Salary","salaryInput",currentEntry.salary],
        ["Rental / other income","otherIncomeInput",currentEntry.otherIncome],
        ["Dividends","dividendsInput",currentEntry.dividends]
      ].map(([label,id,val])=>`
        <div class="row-line">
          <div class="row-label">${label}</div>
          <input
            class="row-input ledger-num"
            id="${id}"
            type="number"
            inputmode="decimal"
            placeholder="0"
            value="${val||""}"
          >
        </div>
      `).join("")}

      ${incomeAdjustmentRows(currentEntry.incomeAdjustments||[])}

      <button class="add-btn" id="addIncome">+ Add / subtract income</button>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Salary account expenses</div>
        <div class="section-total red">${fmt(t.salaryExp)}</div>
      </div>

      ${rows(currentEntry.salaryExpenses||[],"salaryExpenses")}

      <button class="add-btn" id="addSal">+ Add expense</button>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Liquid savings</div>
        <div class="section-total green">${fmt(t.liquidSavings)}</div>
      </div>
      ${liquidSavingRows(currentEntry.liquidSavings||[])}
      <button class="add-btn" id="addLiquid">+ Add liquid saving</button>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Credit card spending</div>
        <div class="section-total gold">${fmt(t.cardExp)}</div>
      </div>

      ${rows(currentEntry.cardExpenses||[],"cardExpenses")}

      <button class="add-btn" id="addCard">+ Add card expense</button>
    </div>

    <div class="section muted">
      <div class="section-head">
        <div class="section-title">Savings account interest</div>
        <div class="section-total gold">${fmt(t.savingsInterest)}</div>
      </div>

      <div class="row-line">
        <div class="row-label">Interest</div>
        <input
          class="row-input ledger-num"
          id="savingsInterestInput"
          type="number"
          inputmode="decimal"
          placeholder="0"
          value="${currentEntry.savingsInterest||""}"
        >
      </div>
    </div>

    <div class="section muted">
      <div class="section-head">
        <div class="section-title">Investments</div>
        <div class="section-total gold">${fmt(t.investments)}</div>
      </div>

      ${investmentRows(currentEntry.investments||[])}

      <button class="add-btn" id="addInv">+ Add investment</button>
    </div>

    <div class="save-bar">
      <button class="save-btn" id="save">Save month</button>
    </div>

    <div class="save-status" id="status"></div>

    <div class="data-bar">
      <button class="data-btn" id="excel">Export Excel</button>
      <button class="data-btn" id="export">Export backup</button>
      <button class="data-btn" id="importBtn">Import backup</button>
      <input id="file" type="file" accept=".json" hidden>
    </div>

    <div class="divider"><span>Year in review</span></div>
    <div id="year"></div>
  `;

  bind();
  renderYear();
}

function bind(){
  document.getElementById("prev").onclick=()=>change(-1);
  document.getElementById("next").onclick=()=>change(1);

  [
    "salaryInput",
    "otherIncomeInput",
    "dividendsInput",
    "savingsInterestInput"
  ].forEach(id=>{
    document.getElementById(id).oninput=e=>{
      currentEntry[
        id==="salaryInput"?"salary":
        id==="otherIncomeInput"?"otherIncome":
        id==="dividendsInput"?"dividends":
        "savingsInterest"
      ]=Number(e.target.value)||0;

      refresh();
    };
  });

  document.getElementById("addIncome").onclick=()=>{
    sync();
    currentEntry.incomeAdjustments=currentEntry.incomeAdjustments||[];
    currentEntry.incomeAdjustments.push({
      id:uid(),
      sign:"add",
      note:"",
      amount:""
    });
    render();
  };

  document.getElementById("addSal").onclick=()=>{
    sync();
    currentEntry.salaryExpenses.push({
      id:uid(),
      category:"Miscellaneous",
      note:"",
      amount:""
    });
    render();
  };

  document.getElementById("addLiquid").onclick=()=>{
    sync();
    currentEntry.liquidSavings=currentEntry.liquidSavings||[];
    currentEntry.liquidSavings.push({id:uid(),bucket:"",note:"",amount:""});
    render();
  };

  document.getElementById("addCard").onclick=()=>{
    sync();
    currentEntry.cardExpenses.push({
      id:uid(),
      category:"Miscellaneous",
      note:"",
      amount:""
    });
    render();
  };

  document.getElementById("addInv").onclick=()=>{
    sync();
    currentEntry.investments.push({
      id:uid(),
      note:"",
      amount:""
    });
    render();
  };

  document.querySelectorAll(".exp-del").forEach(btn=>{
    btn.onclick=()=>{
      sync();
      currentEntry[btn.dataset.group]=currentEntry[btn.dataset.group]
        .filter(x=>x.id!==btn.dataset.id);
      render();
    };
  });

  document.querySelectorAll("[data-field]").forEach(el=>{
    el.oninput=el.onchange=()=>{
      const item=(currentEntry[el.dataset.group]||[])
        .find(x=>x.id===el.dataset.id);

      if(item){
        item[el.dataset.field]=el.dataset.field==="amount"
          ?Number(el.value)||0
          :el.value;
      }

      refresh();
    };
  });

  document.getElementById("save").onclick=save;
  document.getElementById("excel").onclick=exportExcel;
  document.getElementById("export").onclick=exportBackup;

  document.getElementById("importBtn").onclick=()=>{
    document.getElementById("file").click();
  };

  document.getElementById("file").onchange=importBackup;
}

function refresh(){
  const t=totals(currentEntry);

  const hero=document.querySelector(".hero-figure");
  const rate=document.querySelector(".hero-rate");

  hero.textContent=fmt(t.savings);
  hero.className="hero-figure "+(t.savings>=0?"pos":"neg");
  rate.textContent=t.income?(t.rate*100).toFixed(1)+"% savings rate":"—";

  const splitValues=document.querySelectorAll(".savings-split-row strong");
  if(splitValues[0])splitValues[0].textContent=fmt(t.salaryLeftover);
  if(splitValues[1])splitValues[1].textContent=fmt(t.liquidSavings);
  if(splitValues[2])splitValues[2].textContent=fmt(t.investments);

  const sectionTotals=document.querySelectorAll(".section-total");
  const values=[
    t.income,
    t.salaryExp,
    t.liquidSavings,
    t.cardExp,
    t.savingsInterest,
    t.investments
  ];

  sectionTotals.forEach((el,i)=>{
    if(values[i]!==undefined)el.textContent=fmt(values[i]);
  });
}

function save(){
  sync();
  const ok=saveEntry(viewYear,viewMonth,currentEntry);
  const status=document.getElementById("status");

  status.textContent=ok?"Saved ✓":"Could not save";
  status.style.color=ok?"var(--green)":"var(--red)";

  renderYear();

  setTimeout(()=>{
    if(status)status.textContent="";
  },2500);
}

function change(direction){
  sync();
  saveEntry(viewYear,viewMonth,currentEntry);

  viewMonth+=direction;

  if(viewMonth<0){
    viewMonth=11;
    viewYear--;
  }

  if(viewMonth>11){
    viewMonth=0;
    viewYear++;
  }

  currentEntry=loadEntry(viewYear,viewMonth);
  render();
}

function renderYear(){
  const wrap=document.getElementById("year");
  const yearRows=[];
  for(let m=0;m<12;m++){
    let e;
    if(m===viewMonth)e=currentEntry;
    else if(db[key(viewYear,m)])e=withIds(clone(db[key(viewYear,m)]));
    else e=empty();
    const t=totals(e);
    yearRows.push({month:MONTHS[m].slice(0,3),income:t.income,expenses:t.salaryExp,salaryLeftover:t.salaryLeftover,liquidSavings:t.liquidSavings,investments:t.investments,savings:t.savings,savingsInterest:t.savingsInterest});
  }
  const yi=yearRows.reduce((s,r)=>s+r.income,0);
  const ye=yearRows.reduce((s,r)=>s+r.expenses,0);
  const yleft=yearRows.reduce((s,r)=>s+r.salaryLeftover,0);
  const yliquid=yearRows.reduce((s,r)=>s+r.liquidSavings,0);
  const yinv=yearRows.reduce((s,r)=>s+r.investments,0);
  const ys=yearRows.reduce((s,r)=>s+r.savings,0);
  const yint=yearRows.reduce((s,r)=>s+r.savingsInterest,0);
  const yr=yi?ys/yi*100:0;
  const max=Math.max(1,...yearRows.map(r=>Math.abs(r.savings)));
  const bw=26,gap=10,ch=90,base=45,w=yearRows.length*(bw+gap);
  const bars=yearRows.map((r,i)=>{const x=i*(bw+gap),h=Math.abs(r.savings)/max*(ch/2-6),y=r.savings>=0?base-h:base,c=r.savings>=0?"var(--green)":"var(--red)";return`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" fill="${c}" rx="2"/><text x="${x+bw/2}" y="${ch+12}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${r.month}</text>`;}).join("");
  wrap.innerHTML=`
    <div class="year-kpis">
      <div class="kpi"><div class="kpi-label">Income</div><div class="kpi-value">${fmt(yi)}</div></div>
      <div class="kpi"><div class="kpi-label">Actual expenses</div><div class="kpi-value">${fmt(ye)}</div></div>
      <div class="kpi"><div class="kpi-label">Total savings</div><div class="kpi-value" style="color:${ys>=0?"var(--green)":"var(--red)"}">${fmt(ys)}</div></div>
      <div class="kpi"><div class="kpi-label">Savings rate</div><div class="kpi-value">${yr.toFixed(1)}%</div></div>
    </div>
    <div class="year-kpis">
      <div class="kpi"><div class="kpi-label">Salary leftover</div><div class="kpi-value">${fmt(yleft)}</div></div>
      <div class="kpi"><div class="kpi-label">Liquid savings</div><div class="kpi-value green">${fmt(yliquid)}</div></div>
      <div class="kpi"><div class="kpi-label">Investments</div><div class="kpi-value gold">${fmt(yinv)}</div></div>
      <div class="kpi"><div class="kpi-label">Interest</div><div class="kpi-value gold">${fmt(yint)}</div></div>
    </div>
    <div class="chart-wrap"><svg viewBox="0 0 ${w} ${ch+20}" width="100%" height="140"><line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="var(--paper-line)"/>${bars}</svg></div>
    <table class="year-table"><thead><tr><th>Month</th><th>Leftover</th><th>Liquid</th><th>Invest.</th><th>Total</th></tr></thead><tbody>
      ${yearRows.map(r=>`<tr><td>${r.month}</td><td class="ledger-num">${fmt(r.salaryLeftover)}</td><td class="ledger-num">${fmt(r.liquidSavings)}</td><td class="ledger-num">${fmt(r.investments)}</td><td class="ledger-num">${fmt(r.savings)}</td></tr>`).join("")}
      <tr><td><strong>Total</strong></td><td class="ledger-num"><strong>${fmt(yleft)}</strong></td><td class="ledger-num"><strong>${fmt(yliquid)}</strong></td><td class="ledger-num"><strong>${fmt(yinv)}</strong></td><td class="ledger-num"><strong>${fmt(ys)}</strong></td></tr>
    </tbody></table>`;
}

/* Excel export */
function exportExcel(){
  sync();
  saveEntry(viewYear,viewMonth,currentEntry);

  if(typeof XLSX==="undefined"){
    alert("Excel export could not load. Please open the app with an internet connection and try again.");
    return;
  }

  const monthly=[];
  const salaryRows=[];
  const liquidExportRows=[];
  const cardRows=[];
  const investmentRows=[];
  const adjustmentRows=[];

  Object.keys(db).sort().forEach(k=>{
    const parts=k.split("-");
    const year=Number(parts[0]);
    const monthIndex=Number(parts[1])-1;
    const month=MONTHS[monthIndex];
    const e=db[k]||empty();
    const t=totals(e);

    monthly.push({
      Year:year,
      Month:month,
      Salary:Number(e.salary)||0,
      "Rental / Other Income":Number(e.otherIncome)||0,
      Dividends:Number(e.dividends)||0,
      "Income Adjustments":adjustmentTotal(e),
      "Total Income":t.income,
      "Actual Salary Account Expenses":t.salaryExp,
      "Salary Account Leftover":t.salaryLeftover,
      "Liquid Savings":t.liquidSavings,
      "Credit Card Spending":t.cardExp,
      "Savings Account Interest":t.savingsInterest,
      Investments:t.investments,
      "Total Savings":t.savings,
      "Savings Rate %":Number((t.rate*100).toFixed(2))
    });

    (e.salaryExpenses||[]).forEach(x=>{
      salaryRows.push({
        Year:year,
        Month:month,
        Category:x.category||"",
        Note:x.note||"",
        Amount:Number(x.amount)||0
      });
    });

    (e.liquidSavings||[]).forEach(x=>{
      liquidExportRows.push({Year:year,Month:month,Bucket:x.bucket||"",Note:x.note||"",Amount:Number(x.amount)||0});
    });

    (e.cardExpenses||[]).forEach(x=>{
      cardRows.push({
        Year:year,
        Month:month,
        Category:x.category||"",
        Note:x.note||"",
        Amount:Number(x.amount)||0
      });
    });

    (e.investments||[]).forEach(x=>{
      investmentRows.push({
        Year:year,
        Month:month,
        Investment:x.note||"",
        Amount:Number(x.amount)||0
      });
    });

    (e.incomeAdjustments||[]).forEach(x=>{
      const amount=Number(x.amount)||0;

      adjustmentRows.push({
        Year:year,
        Month:month,
        Type:(x.sign||"add")==="subtract"?"Subtract":"Add",
        Note:x.note||"",
        Amount:(x.sign||"add")==="subtract"?-amount:amount
      });
    });
  });

  const wb=XLSX.utils.book_new();

  const monthlySheet=XLSX.utils.json_to_sheet(monthly);
  const salarySheet=XLSX.utils.json_to_sheet(salaryRows);
  const liquidSheet=XLSX.utils.json_to_sheet(liquidExportRows);
  const cardSheet=XLSX.utils.json_to_sheet(cardRows);
  const investmentSheet=XLSX.utils.json_to_sheet(investmentRows);
  const adjustmentSheet=XLSX.utils.json_to_sheet(adjustmentRows);

  monthlySheet["!cols"]=[
    {wch:8},{wch:12},{wch:14},{wch:22},{wch:12},{wch:20},{wch:16},
    {wch:24},{wch:20},{wch:22},{wch:14},{wch:16},{wch:16}
  ];

  salarySheet["!cols"]=[
    {wch:8},{wch:12},{wch:22},{wch:28},{wch:14}
  ];

  liquidSheet["!cols"]=[
    {wch:8},{wch:12},{wch:24},{wch:28},{wch:14}
  ];

  cardSheet["!cols"]=[
    {wch:8},{wch:12},{wch:22},{wch:28},{wch:14}
  ];

  investmentSheet["!cols"]=[
    {wch:8},{wch:12},{wch:32},{wch:14}
  ];

  adjustmentSheet["!cols"]=[
    {wch:8},{wch:12},{wch:12},{wch:28},{wch:14}
  ];

  XLSX.utils.book_append_sheet(wb,monthlySheet,"Monthly Summary");
  XLSX.utils.book_append_sheet(wb,salarySheet,"Salary Expenses");
  XLSX.utils.book_append_sheet(wb,liquidSheet,"Liquid Savings");
  XLSX.utils.book_append_sheet(wb,cardSheet,"Credit Card");
  XLSX.utils.book_append_sheet(wb,investmentSheet,"Investments");
  XLSX.utils.book_append_sheet(wb,adjustmentSheet,"Income Adjustments");

  const today=new Date();
  const stamp=
    today.getFullYear()+"-"+
    String(today.getMonth()+1).padStart(2,"0")+"-"+
    String(today.getDate()).padStart(2,"0");

  const filename="Savings_Ledger_All_Years_"+stamp+".xlsx";

  const output=XLSX.write(wb,{
    bookType:"xlsx",
    type:"array"
  });

  const blob=new Blob([output],{
    type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  });

  downloadBlob(blob,filename);
}

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* JSON backup */
function exportBackup(){
  sync();
  saveEntry(viewYear,viewMonth,currentEntry);

  const blob=new Blob(
    [JSON.stringify(db,null,2)],
    {type:"application/json"}
  );

  downloadBlob(blob,"savings-ledger-backup.json");
}

async function importBackup(e){
  const f=e.target.files[0];
  if(!f)return;

  try{
    const obj=JSON.parse(await f.text());

    if(!obj||typeof obj!=="object"||Array.isArray(obj)){
      throw new Error();
    }

    db=obj;
    persist();

    currentEntry=loadEntry(viewYear,viewMonth);
    render();

  }catch(err){
    alert("Invalid backup file.");
  }

  e.target.value="";
}

currentEntry=loadEntry(viewYear,viewMonth);
render();

})();
</script>

    navigator.serviceWorker

      .then(registration=>registration.update())
      .catch(console.error);
  });
}
